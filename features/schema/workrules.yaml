"$id": "https://openrailwaymap.app/schema/signals_railway_signals.yaml"
"$schema": "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  workrules:
    type: array
    description: Defines the list of known workrules
    items:
      type: object
      properties:
        country:
          type: string
          description: The country this operator primarily operates in
        name:
          type: string
          description: The name of the workrule.
        value:
          type: string
          description: The tag value of the `workrules` tag.
      additionalProperties: false
  $schema:
    type: string
additionalProperties: false
