"$id": "https://openrailwaymap.app/schema/radio.yaml"
type: object
properties:
  radio:
    type: array
    items:
      type: object
      properties:
        value:
          type: string
          description: The value of the `railway:radio` tag
        name:
          type: string
          description: The name of the radio system
        color:
          type: string
          description: The color used to show the radio system on the map
      additionalProperties: false
  $schema:
    type: string
additionalProperties: false
