# This workflow builds postgis/postgis for multiple architectures, until issue https://github.com/postgis/docker-postgis/issues/216 is resolved.
# Uses https://github.com/reneleonhardt/docker-postgis/commit/9b81657fbf9520d696de2d4305e7781b6fc7ec2b published to a package.

name: Build PostGIS image

on:
  workflow_dispatch: ~
  push: ~

jobs:
  build-postgis:
    name: Build PostGIS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: reneleonhardt/docker-postgis
          ref: 9b81657fbf9520d696de2d4305e7781b6fc7ec2b

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          make image 19rc1 3.7 alpine

      - name: Push image
        run: |
          docker tag postgis/postgis:19rc1-3.7-alpine ghcr.io/${{ github.repository_owner }}/postgis:19rc1-3.7-alpine
          docker push ghcr.io/${{ github.repository_owner }}/postgis:19rc1-3.7-alpine
